name: m8c-ios
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "15.6"
configs:
  Debug: debug
  Release: release
settings:
  base:
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", USE_RTMIDI=1, __MACOSX_CORE__=1, M8C_COREMIDI_DISCOVERY=1]
projectReferences:
  SDL:
    path: ext/SDL/Xcode/SDL/SDL.xcodeproj
targets:
  m8c-ios:
    type: application
    platform: iOS
    sources:
      - path: src
        includes: ["**/*.c", "**/*.h", "**/*.m"]
        excludes:
          - backends/m8_libserialport.c
          - backends/m8_libusb.c
          - backends/audio_libusb.c
      - path: ext/rtmidi
        includes: ["*.cpp", "*.h"]
      - path: package/ios/Assets.xcassets
      - path: package/ios/Base.lproj/LaunchScreen.storyboard
      - path: gamecontrollerdb.txt
        buildPhase: resources
    configFiles:
      Debug: package/ios/App.xcconfig
      Release: package/ios/App.xcconfig
    settings:
      base:
        GCC_C_LANGUAGE_STANDARD: gnu17
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/ext/rtmidi"]
        INFOPLIST_FILE: package/ios/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: NO
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: 0
          GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", DEBUG=1]
        Release:
          GCC_OPTIMIZATION_LEVEL: 2
          GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", NDEBUG=1]
    dependencies:
      - target: SDL/SDL3
        embed: true
        codeSign: true
        removeHeaders: true
      - sdk: CoreMIDI.framework
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
      - sdk: Foundation.framework
      - sdk: libc++.tbd
schemes:
  m8c-ios:
    build:
      targets:
        m8c-ios: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
